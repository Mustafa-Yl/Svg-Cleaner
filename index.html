<!doctype html>
<html lang="tr" data-theme="dark" data-accent="purple">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16161c" />
    <title>MYL Toolkit — SVG & Görsel Araçları</title>
    <meta
      name="description"
      content="Tarayıcıda çalışan ücretsiz görsel dönüştürücü ve SVG temizleyici. PNG, JPEG, WebP, AVIF arası dönüşüm. Dosyalar yüklenmez, her şey cihazında işlenir."
    />
    <!-- ?v= sorgusu yok: derlemede dosya adına hash ekleniyor, önbellek
         kırma işini o hallediyor. -->
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />

    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Barlow+Condensed:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- ══ ÜST ÇUBUK ═══════════════════════════════════ -->
    <header class="topbar">
      <a class="brand" href="#" aria-label="MYL Toolkit ana sayfa">
        <span class="brand-icon">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M11.42 15.17L17.25 21A2.652 2.652 0 0021 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 11-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 004.486-6.336l-3.276 3.277a3.004 3.004 0 01-2.25-2.25l3.276-3.276a4.5 4.5 0 00-6.336 4.486c.091 1.076-.071 2.264-.904 2.95l-.102.085m-1.745 1.437L5.909 7.5H4.5L2.25 3.75l1.5-1.5L7.5 4.5v1.409l4.26 4.26m-1.745 1.437l1.745-1.437"
            />
          </svg>
        </span>
        <span class="brand-name">MYL<b>TOOLKIT</b></span>
      </a>

      <!-- Aktif araç adı topbar'da DEĞİL: masaüstünde ayar panelinin başında,
           mobilde çekmece başlığında ve alt sekmede görünüyor. -->
      <div class="tc" id="toolStats"></div>

      <div class="tr">
        <button class="icon-btn" id="settingsBtn" title="Ayarlar" aria-label="Ayarlar">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10.343 3.94c.09-.542.56-.94 1.11-.94h1.093c.55 0 1.02.398 1.11.94l.149.894c.07.424.384.764.78.93.398.164.855.142 1.205-.108l.737-.527a1.125 1.125 0 011.45.12l.773.774c.39.389.44 1.002.12 1.45l-.527.737c-.25.35-.272.806-.107 1.204.165.397.505.71.93.78l.893.15c.543.09.94.559.94 1.109v1.094c0 .55-.397 1.02-.94 1.11l-.893.149c-.425.07-.765.383-.93.78-.165.398-.143.854.107 1.204l.527.738c.32.447.269 1.06-.12 1.45l-.774.773a1.125 1.125 0 01-1.449.12l-.738-.527c-.35-.25-.806-.272-1.203-.107-.397.165-.71.505-.781.929l-.149.894c-.09.542-.56.94-1.11.94h-1.094c-.55 0-1.019-.398-1.11-.94l-.148-.894c-.071-.424-.384-.764-.781-.93-.398-.164-.854-.142-1.204.108l-.738.527c-.447.32-1.06.269-1.45-.12l-.773-.774a1.125 1.125 0 01-.12-1.45l.527-.737c.25-.35.273-.806.108-1.204-.165-.397-.505-.71-.93-.78l-.894-.15c-.542-.09-.94-.56-.94-1.109v-1.094c0-.55.398-1.02.94-1.11l.894-.149c.424-.07.765-.383.93-.78.165-.398.143-.854-.108-1.204l-.526-.738a1.125 1.125 0 01.12-1.45l.773-.773a1.125 1.125 0 011.45-.12l.737.527c.35.25.807.272 1.204.107.397-.165.71-.505.78-.929l.15-.894z"/>
            <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
        </button>
        <div class="theme-pill">
          <button class="theme-btn active" data-t="dark" title="Koyu tema" aria-label="Koyu tema">🌙</button>
          <button class="theme-btn" data-t="light" title="Açık tema" aria-label="Açık tema">☀️</button>
        </div>
      </div>
    </header>

    <!-- ══ UYGULAMA ════════════════════════════════════ -->
    <div class="app" id="app">
      <!-- Masaüstü: sol ikon rayı -->
      <nav class="rail" id="rail" aria-label="Araçlar"></nav>

      <!-- Ayar paneli. Mobilde bu yuvadan alınıp çekmeceye taşınır. -->
      <div class="sidebar-slot" id="sidebarSlot">
        <aside class="sidebar" id="sidebar">
          <!-- Başlık kabuk tarafından doldurulur, gövdeyi araç yazar -->
          <div class="sidebar-head" id="sidebarHead"></div>
          <div class="sidebar-body" id="sidebarBody"></div>
        </aside>
      </div>

      <main class="workspace" id="workspace"></main>
    </div>

    <!-- Mobil: alt sekme çubuğu -->
    <nav class="bottom-nav" id="bottomNav" aria-label="Araçlar"></nav>

    <!-- ══ OVERLAY / BİLDİRİM ══════════════════════════ -->
    <div class="drop-ov" id="dropOv">
      <div class="drop-box">
        <svg width="42" height="42" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/>
        </svg>
        <span id="dropHint">Dosyaları bırak</span>
      </div>
    </div>

    <div class="t-rack" id="rack" aria-live="polite"></div>

    <noscript>
      <div class="fatal">
        <h3>JavaScript gerekli</h3>
        <p>Bu araç tamamen tarayıcında çalışır; çalışması için JavaScript açık olmalı.</p>
      </div>
    </noscript>

    <!--
      JSZip: toplu indirme için gerekli. Klasik script (worker'lar ES modül).
      Mutlak URL olduğu için derlemede olduğu gibi bırakılır.

      jQuery ve Bootstrap kaldırıldı: kod tabanında sıfır kullanım vardı,
      yayında ~50 KB boşuna iniyordu. jQuery'ye ihtiyacın olursa bu satırı
      geri ekle:
      <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
